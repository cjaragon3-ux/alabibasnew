<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Information</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #172033;
			background: #f4f6fb;
		}

		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; }
		a { color: inherit; }

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			padding: 18px max(24px, calc((100% - 1040px) / 2));
			background: #fff;
			border-bottom: 1px solid #e8ebf2;
		}

		.brand { font-size: 15px; font-weight: 750; letter-spacing: .02em; }
		.greeting {
			color: #5146d8;
			font-size: 14px;
			font-weight: 650;
			text-decoration: none;
		}

		main { width: min(100% - 32px, 920px); margin: 52px auto; }
		.page-heading { margin: 0 0 8px; font-size: clamp(26px, 4vw, 34px); }
		.intro { margin: 0 0 28px; color: #667085; }
		.profile-card {
			overflow: hidden;
			background: #fff;
			border: 1px solid #e7eaf1;
			border-radius: 16px;
			box-shadow: 0 12px 32px rgb(25 36 66 / 6%);
			scroll-margin-top: 24px;
		}

		.profile-header {
			display: flex;
			align-items: center;
			gap: 18px;
			padding: 26px 30px;
			background: linear-gradient(110deg, #f3f2ff, #f8f9ff);
			border-bottom: 1px solid #e9e9f5;
		}

		.avatar {
			display: grid;
			flex: 0 0 64px;
			width: 64px;
			height: 64px;
			place-items: center;
			border-radius: 50%;
			background: #5146d8;
			color: #fff;
			font-size: 22px;
			font-weight: 700;
		}

		.profile-header h2 { margin: 0 0 4px; font-size: 21px; }
		.profile-header p { margin: 0; color: #667085; font-size: 14px; }
		.section-title { margin: 0; padding: 22px 30px 4px; font-size: 16px; }
		.details {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 0 32px;
			padding: 4px 30px 26px;
		}

		.detail { padding: 17px 0; border-bottom: 1px solid #eef0f4; }
		.detail:nth-last-child(-n + 2) { border-bottom: 0; }
		dt { margin-bottom: 6px; color: #737d90; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; }
		dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
		.status { color: #147a4b; font-weight: 650; }

		@media (max-width: 560px) {
			.topbar { padding: 16px; }
			main { margin-top: 34px; }
			.profile-header { padding: 22px; }
			.section-title { padding-left: 22px; }
			.details { grid-template-columns: 1fr; padding: 4px 22px 18px; }
			.detail:nth-last-child(2) { border-bottom: 1px solid #eef0f4; }
			.detail:last-child { border-bottom: 0; }
		}
	</style>
</head>
<body>
	<header class="topbar">
		<div class="brand">Account</div>
		<span class="greeting">Hi, mamboclat</span>
	</header>

	<main>
		<h1 class="page-heading">User information</h1>
		<p class="intro">View the details associated with your account.</p>

		<section class="profile-card" id="user-information" aria-labelledby="profile-name">
			<div class="profile-header">
				<div class="avatar" aria-hidden="true">M</div>
				<div>
					<h2 id="profile-name">mamboclat</h2>
					<p>Personal account</p>
				</div>
			</div>
			<h3 class="section-title">Account details</h3>
			<dl class="details">
				<div class="detail">
					<dt>Username</dt>
					<dd>mamboclat</dd>
				</div>
				<div class="detail">
					<dt>Account type</dt>
					<dd>Personal</dd>
				</div>
				<div class="detail">
					<dt>Status</dt>
					<dd class="status">Active</dd>
				</div>
				<div class="detail">
					<dt>Contact information</dt>
					<dd>Not provided</dd>
				</div>
			</dl>
		</section>
	</main>
</body>
</html>
